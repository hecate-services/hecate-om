# Structural lint, EUnit, and the Common Test suites.
#
# THE TEMPLATE SUITE IS THE REASON THIS EXISTS. hecate_om ships the scaffold
# every other service is generated from, and the previous templates drifted for
# months precisely because nothing ran them: they emitted a Quadlet unit nothing
# on the fleet uses, TODOs in place of callbacks, and an identity_spec claiming
# authority the generated service could not exercise. A guard nobody runs is not
# a guard. `rebar3 eunit` joined this job for the same reason, 2026-08-24: the
# mesh-wrappers pieces (hecate_om_capabilities/_pubsub/_content) shipped with
# real test coverage that nothing was running -- CI only ever called `rebar3 ct`,
# so a regression in any of it would have stayed green.
#
# Runs on the glibc erlang image, matching local dev (OTP 28), where macula
# resolves a prebuilt QUIC NIF and no Rust toolchain is needed. cmake, a C++
# toolchain, and the codec dev libs ARE still needed: barrel_docdb pulls in
# rocksdb, which builds its NIF from source via CMake -- the base erlang
# image ships none of it. This was broken in two stages, both silent because
# nothing checked `gh run view` after the pushes that caused them:
#   1. `cmake: not found`, failing at the dependency-compile step inside
#      `rebar3 lint`, since barrel_docdb was added.
#   2. Once cmake was installed: rocksdb's CMakeLists auto-detects system
#      Snappy via `find_package(Snappy)` and, if it's missing, disables
#      Snappy support WITHOUT failing the build -- so the compile step went
#      green while producing a NIF barrel_docdb's runtime config can't
#      actually open (`rebar3 ct` then failed at boot with "The specified
#      blob compression type Snappy is not available"). lz4/zstd/bz2 go
#      through the same silent auto-detect, so all four dev libs are
#      installed here, not just the one that happened to be exercised.

name: lint-and-test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: erlang:28
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends cmake build-essential libsnappy-dev liblz4-dev libzstd-dev libbz2-dev
      - run: rebar3 lint
      - run: rebar3 eunit
      # hecate_service_template_SUITE shells out to `rebar3 new', so rebar3 must
      # be on PATH inside the container. The erlang image ships it.
      - run: rebar3 ct

  # test_live/*.erl hit a real demo-fleet station (station-de-frankfurt.macula.io)
  # over the network -- genuinely valuable (they've caught three real bugs no
  # unit test could have), but the demo fleet is documented, disposable dev
  # infra with no uptime guarantee, so this job must never block a merge on a
  # station blip. continue-on-error surfaces a failure (this job goes yellow,
  # visible in the run) without turning the check red. See rebar.config's
  # `live_test` profile and any test_live/*.erl moduledoc for the full reasoning.
  live-mesh-tests:
    runs-on: ubuntu-latest
    container:
      image: erlang:28
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends cmake build-essential libsnappy-dev liblz4-dev libzstd-dev libbz2-dev
      - run: rebar3 as live_test eunit --dir test_live
