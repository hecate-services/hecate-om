# Structural lint, EUnit, and the Common Test suites.
#
# THE TEMPLATE SUITE IS THE REASON THIS EXISTS. hecate_om ships the scaffold
# every other service is generated from, and the previous templates drifted for
# months precisely because nothing ran them: they emitted a Quadlet unit nothing
# on the fleet uses, TODOs in place of callbacks, and an identity_spec claiming
# authority the generated service could not exercise. A guard nobody runs is not
# a guard. `rebar3 eunit` joined this job for the same reason, 2026-08-24: the
# mesh-wrappers pieces (hecate_om_capabilities/_pubsub/_content) shipped with
# real test coverage that nothing was running -- CI only ever called `rebar3 ct`,
# so a regression in any of it would have stayed green.
#
# Runs on the glibc erlang image, matching local dev (OTP 28). cmake, a C++
# toolchain, and the codec dev libs are needed: barrel_docdb pulls in
# rocksdb, which builds its NIF from source via CMake -- the base erlang
# image ships none of it. This was broken in three stages, all silent
# because nothing checked `gh run view` after the pushes that caused them:
#   1. `cmake: not found`, failing at the dependency-compile step inside
#      `rebar3 lint`, since barrel_docdb was added.
#   2. Once cmake was installed: rocksdb's CMakeLists auto-detects system
#      Snappy via `find_package(Snappy)` and, if it's missing, disables
#      Snappy support WITHOUT failing the build -- so the compile step went
#      green while producing a NIF barrel_docdb's runtime config can't
#      actually open (`rebar3 ct` then failed at boot with "The specified
#      blob compression type Snappy is not available"). lz4/zstd/bz2 go
#      through the same silent auto-detect, so all four dev libs are
#      installed here, not just the one that happened to be exercised.
#   3. This job previously claimed "macula resolves a prebuilt QUIC NIF and
#      no Rust toolchain is needed" -- true for the QUIC NIF's own
#      precompiled-download path, but macula_cbor_nif (macula's CBOR wire
#      codec, no Erlang fallback by design) always builds from source, and
#      macula's own build script silently skipped it with cargo missing
#      (fixed separately in macula-io/macula 10.14.3, but that alone
#      doesn't put cargo in THIS container). `rebar3 compile` and `rebar3
#      lint` both went green with the NIF never built; `rebar3 eunit` then
#      failed 7 tests with nif_not_loaded, the same silent-then-late
#      pattern as stage 2. Installing Rust here is the actual fix, not a
#      newer macula alone.

name: lint-and-test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: erlang:28
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends cmake build-essential libsnappy-dev liblz4-dev libzstd-dev libbz2-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: rebar3 lint
      - run: rebar3 eunit
      # hecate_service_template_SUITE shells out to `rebar3 new', so rebar3 must
      # be on PATH inside the container. The erlang image ships it.
      - run: rebar3 ct

  # test_live/*.erl hit a real demo-fleet station (station-de-frankfurt.macula.io)
  # over the network -- genuinely valuable (they've caught three real bugs no
  # unit test could have). continue-on-error surfaces a failure (this job goes
  # yellow, visible in the run) without turning the check red.
  #
  # ⚠ Confirmed 2026-08-31: this job's real failure mode is not "occasional
  # station blip" (what this comment used to say) -- it fails 100% of the
  # time, deterministically, on every run, for a reason no station-side fix
  # touches: `station-de-frankfurt.macula.io` has ONLY an AAAA record
  # (`dig AAAA` -> 2a01:7e01::f03c:94ff:fe22:719e; `dig A` -> nothing), and
  # GitHub-hosted runners (ubuntu-latest, incl. this container) have no IPv6
  # egress at all -- a platform limitation, not something this repo's code
  # or workflow config can route around. `wait_healthy/2` in every
  # test_live/*.erl module times out waiting for `healthy_links > 0` because
  # the QUIC connect can never even reach the station, not because it's
  # unhealthy. continue-on-error is doing real work here and should stay --
  # but don't read a red live-mesh-tests run as "the station had a blip";
  # read it as "expected on a GitHub-hosted runner, uninformative until
  # this runs somewhere with IPv6 egress." A self-hosted runner (this
  # user's own boxes are already IPv6-capable) or an IPv4 listener added
  # station-side would both fix it for real; neither is a workflow-file
  # change. See rebar.config's `live_test` profile and any
  # test_live/*.erl moduledoc for the rest of the reasoning.
  live-mesh-tests:
    runs-on: ubuntu-latest
    container:
      image: erlang:28
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends cmake build-essential libsnappy-dev liblz4-dev libzstd-dev libbz2-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: rebar3 as live_test eunit --dir test_live
